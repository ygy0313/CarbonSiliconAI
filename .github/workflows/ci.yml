name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: 语法检查 + 端到端冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 全部 JS 语法检查
        run: |
          fail=0
          for f in $(git ls-files '*.js'); do
            node --check "$f" || { echo "语法错误: $f"; fail=1; }
          done
          exit $fail

      - name: 小程序 WXML 体检
        run: node miniprogram/scripts/check-wxml.js

      - name: 小程序结构体检（注册完整性 / tabBar / 页面逻辑桩）
        run: node miniprogram/scripts/check-mp.js

      - name: 启动后端
        run: |
          cd server
          node src/index.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/health > /dev/null; then
              echo "服务已就绪"
              exit 0
            fi
            sleep 1
          done
          echo "服务启动失败，日志："
          cat /tmp/server.log
          exit 1

      - name: 端到端冒烟（33 项）
        run: |
          cd server
          NO_PROXY=127.0.0.1,localhost no_proxy=127.0.0.1,localhost node scripts/smoke.js

      - name: 隐私链路回归（52 项：脱敏/授权/导出/恢复）
        run: |
          cd server
          NO_PROXY=127.0.0.1,localhost no_proxy=127.0.0.1,localhost node scripts/check-privacy.js

      - name: 能力回归（33 项：意图路由/选酒判断/记梦结构/边界）
        run: |
          cd server
          NO_PROXY=127.0.0.1,localhost no_proxy=127.0.0.1,localhost node scripts/check-agents.js

      - name: 法律文本回归（76 项：条款覆盖/禁词/H5 直出/XSS）
        run: |
          cd server
          NO_PROXY=127.0.0.1,localhost no_proxy=127.0.0.1,localhost node scripts/check-legal.js

      - name: 输入端回归（39 项：识图/转写校验与「不留存」承诺）
        run: |
          cd server
          NO_PROXY=127.0.0.1,localhost no_proxy=127.0.0.1,localhost node scripts/check-input.js

      - name: C++ 内核自检
        run: |
          cd core
          make
          ./bin/qjz-core selftest

      - name: 启动 C++ 内核
        run: |
          core/bin/qjz-core serve 8788 > /tmp/core.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8788/health > /dev/null; then
              echo "内核已就绪"
              exit 0
            fi
            sleep 1
          done
          echo "内核启动失败（Node 端会自动降级，但 CI 里要求完整链路），日志："
          cat /tmp/core.log
          exit 1

      - name: 经验资产回归（闭环/双环/隔离/双实现同构）
        run: |
          cd server
          NO_PROXY=127.0.0.1,localhost no_proxy=127.0.0.1,localhost node scripts/check-experience.js

      - name: Obsidian 决策经验闭环回归（解析/幂等同步/重排序/反馈）
        run: node server/scripts/check-obsidian.js

      - name: 执笔人格回归（不做应声虫约定/品牌红线）
        run: node server/scripts/check-persona.js

      - name: vault 检索回归（打分/缓存/scope=vault 票据）
        run: node server/scripts/check-vaultsearch.js

      - name: 干支历算自检（26 项）
        run: node server/scripts/verify-ganzhi.js

      - name: 失败时输出服务日志
        if: failure()
        run: cat /tmp/server.log || true

  # 测试全绿才部署。没配密钥就明确跳过，不让流水线红着。
  # 需要的 Secrets：ECS_SSH_KEY（私钥全文）、ECS_HOST（IP 或域名）、ECS_USER（默认 root）
  deploy:
    name: 部署到阿里云 ECS
    needs: [smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v4

      - name: 检查是否配了部署密钥
        id: guard
        env:
          KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=跳过自动部署::未配置 ECS_SSH_KEY。本地仍可执行 bash deploy/deploy.sh 一键部署。"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 准备 SSH
        if: steps.guard.outputs.ready == 'true'
        env:
          KEY: ${{ secrets.ECS_SSH_KEY }}
          HOST: ${{ secrets.ECS_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 部署（拉代码 → 重启 → 健康检查 → 失败回滚）
        if: steps.guard.outputs.ready == 'true'
        env:
          QJZ_HOST: ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}
          QJZ_KEY: /home/runner/.ssh/deploy_key
        run: bash deploy/deploy.sh --ci
